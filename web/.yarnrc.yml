# Обычный каталог node_modules: его понимают все инструменты сборки.
nodeLinker: node-modules
enableTelemetry: false

# Один и тот же web/node_modules используют и эта машина, и контейнеры
# node:24-alpine (scripts/test.sh, scripts/lan-docker.sh). Ставим нативные
# модули (rolldown, esbuild, tailwind) сразу для обеих систем — иначе каждая
# установка в одной системе ломает запуск в другой. Списки явные, без
# current: внутри контейнера current — это linux, и macOS выпала бы.
supportedArchitectures:
  os: [darwin, linux]
  cpu: [current]
  libc: [glibc, musl]
