<div class="nk" id="nk">
<a class="nk-skip" href="#nk-main" data-i18n="skip"></a>

<header class="nk-top">
  <div class="nk-wrap nk-top-row">
    <a class="nk-brand" href="#nk-hero">
      <svg class="nk-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="6" y="3" width="20" height="26" rx="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <path d="M11 10h10M11 14.5h10M11 19h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M19.5 3v8l2.5-1.8 2.5 1.8V3" fill="var(--nk-accent)"/>
      </svg>
      <span>naknigu</span>
    </a>
    <nav class="nk-nav" data-i18n-attr="aria-label:nav.label">
      <a href="#nk-how" data-i18n="nav.how"></a>
      <a href="#nk-features" data-i18n="nav.features"></a>
      <a data-href="repo" data-i18n="nav.source"></a>
    </nav>
    <div class="nk-lang" role="group" data-i18n-attr="aria-label:lang.label">
      <button type="button" data-lang="ru" lang="ru" aria-label="Русский">RU</button>
      <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
    </div>
  </div>
</header>

<main id="nk-main" tabindex="-1">

<section class="nk-hero nk-wrap" id="nk-hero" aria-labelledby="nk-hero-title">
  <div class="nk-hero-text">
    <h1 id="nk-hero-title" data-i18n="hero.title"></h1>
    <p class="nk-lead" data-i18n="hero.lead"></p>
    <div class="nk-actions">
      <button type="button" class="nk-btn nk-btn-primary" data-open-book>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="hero.open"></span>
      </button>
      <a class="nk-btn nk-btn-ghost" href="#nk-how" data-i18n="hero.how"></a>
    </div>
    <ul class="nk-facts">
      <li data-i18n="hero.fact1"></li>
      <li data-i18n="hero.fact2"></li>
      <li data-i18n="hero.fact3"></li>
    </ul>
  </div>

  <figure class="nk-stage" aria-labelledby="nk-stage-caption">
    <div class="nk-glow" aria-hidden="true"></div>
    <div class="nk-devices">
    <div class="nk-ereader">
      <div class="nk-ereader-screen">
        <p class="nk-ereader-title" data-i18n="ereader.title"></p>
        <p class="nk-ereader-text" data-i18n="ereader.scan"></p>
        <button type="button" class="nk-qr" data-open-book data-i18n-attr="aria-label:qr.label">
          <span class="nk-qr-code" data-qr aria-hidden="true"></span>
          <span class="nk-qr-expand" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
        <p class="nk-ereader-url" data-url></p>
        <p class="nk-ereader-status" data-status role="status"></p>
      </div>
      <span class="nk-ereader-light" aria-hidden="true"></span>
    </div>

    <div class="nk-phone" aria-hidden="true">
      <div class="nk-phone-body">
        <span class="nk-phone-island"></span>
        <div class="nk-phone-screen">
          <div class="nk-cam">
            <div class="nk-cam-paper"><span class="nk-cam-qr" data-qr></span></div>
            <span class="nk-frame">
              <span class="nk-corner nk-c1"></span><span class="nk-corner nk-c2"></span>
              <span class="nk-corner nk-c3"></span><span class="nk-corner nk-c4"></span>
            </span>
            <span class="nk-scanline"></span>
          </div>
        </div>
      </div>
    </div>
    </div>

    <figcaption id="nk-stage-caption" class="nk-caption" data-i18n="stage.caption"></figcaption>
  </figure>
</section>

<section class="nk-section nk-wrap" id="nk-how" aria-labelledby="nk-how-title">
  <div class="nk-section-head">
    <p class="nk-kicker" data-i18n="how.kicker"></p>
    <h2 id="nk-how-title" data-i18n="how.title"></h2>
    <p class="nk-section-lead" data-i18n="how.lead"></p>
  </div>
  <ol class="nk-steps">
    <li class="nk-step">
      <span class="nk-step-no" aria-hidden="true">1</span>
      <h3 data-i18n="how.1.title"></h3>
      <p data-i18n="how.1.text"></p>
    </li>
    <li class="nk-step">
      <span class="nk-step-no" aria-hidden="true">2</span>
      <h3 data-i18n="how.2.title"></h3>
      <p data-i18n="how.2.text"></p>
    </li>
    <li class="nk-step">
      <span class="nk-step-no" aria-hidden="true">3</span>
      <h3 data-i18n="how.3.title"></h3>
      <p data-i18n="how.3.text"></p>
    </li>
  </ol>
</section>

<section class="nk-section nk-wrap" id="nk-features" aria-labelledby="nk-features-title">
  <div class="nk-section-head">
    <p class="nk-kicker" data-i18n="features.kicker"></p>
    <h2 id="nk-features-title" data-i18n="features.title"></h2>
  </div>
  <ul class="nk-features">
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
      <h3 data-i18n="features.1.title"></h3><p data-i18n="features.1.text"></p>
    </li>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h8v14H3zM13 5h8v14h-8M6 9h2M16 9h2M6 13h2M16 13h2"/></svg>
      <h3 data-i18n="features.2.title"></h3><p data-i18n="features.2.text"></p>
    </li>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 3h10v18l-5-4-5 4z"/></svg>
      <h3 data-i18n="features.3.title"></h3><p data-i18n="features.3.text"></p>
    </li>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01M3 3l18 18"/></svg>
      <h3 data-i18n="features.4.title"></h3><p data-i18n="features.4.text"></p>
    </li>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
      <h3 data-i18n="features.5.title"></h3><p data-i18n="features.5.text"></p>
    </li>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 14a4 4 0 0 0 6 .5l3-3a4 4 0 0 0-5.7-5.7l-1.3 1.3M14 10a4 4 0 0 0-6-.5l-3 3a4 4 0 0 0 5.7 5.7l1.3-1.3"/></svg>
      <h3 data-i18n="features.6.title"></h3><p data-i18n="features.6.text"></p>
    </li>
  </ul>
</section>

<section class="nk-section nk-wrap nk-privacy" id="nk-privacy" aria-labelledby="nk-privacy-title">
  <div class="nk-section-head">
    <p class="nk-kicker" data-i18n="privacy.kicker"></p>
    <h2 id="nk-privacy-title" data-i18n="privacy.title"></h2>
  </div>
  <ul class="nk-privacy-list">
    <li data-i18n="privacy.1"></li>
    <li data-i18n="privacy.2"></li>
    <li data-i18n="privacy.3"></li>
  </ul>
</section>

</main>

<footer class="nk-foot">
  <div class="nk-wrap nk-foot-row">
    <span class="nk-brand nk-brand-small">naknigu</span>
    <a data-href="repo" data-i18n="footer.source"></a>
  </div>
</footer>
</div>

<button type="button" class="nk-back" data-close-book>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span data-i18n="back"></span>
</button>
